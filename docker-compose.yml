services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: tracker_pass
      POSTGRES_DB: sports_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d sports_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      API_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tracker_user
      DB_PASSWORD: tracker_pass
      DB_NAME: sports_tracker
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      INGEST_API_KEY: dev-tracker-key

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
